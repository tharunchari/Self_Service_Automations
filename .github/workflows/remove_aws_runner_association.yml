name: "RunnersAssociation"

on:
  schedule:
    # This will run the workflow every 2 hours
    - cron: "0 16 * * MON"
  workflow_dispatch:

jobs:
  check_instances:
    runs-on: ubuntu-24.04
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'
 
      - name: Install dependencies
        run: pip install boto3 requests

      - name: Install AWS CLI if not present
        run: |
          if ! command -v aws &> /dev/null; then
            echo "AWS CLI not found, installing..."
            curl -s "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
            unzip -q awscliv2.zip
            sudo ./aws/install
            rm -rf awscliv2.zip aws/
            echo "AWS CLI installed: $(aws --version)"
          else
            echo "AWS CLI already present: $(aws --version)"
          fi

      - name: Configure AWS credentials
        uses: Majesco-V3locity/configure-aws-credentials@v1.0
        with:
          aws-access-key-id: ${{ secrets.CORP_CLD_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.CORP_CLD_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - run: python3 PYTHON_Script/remove_aws_runner_association.py
