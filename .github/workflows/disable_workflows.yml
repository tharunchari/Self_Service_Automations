name: Disable GitHub Multiple Workflows

on:
  workflow_dispatch:
    inputs:
      org_name:
        description: 'Organization name (required)'
        required: true
        type: string
      workflows:
        description: 'Workflow file names comma-separated, e.g., ci.yml,deploy.yml (required)'
        required: true
        type: string
      repos:
        description: 'Repository names comma-separated, e.g., repo1,repo2,repo3 (required)'
        required: false
        type: string

jobs:
  disable-workflows:
    runs-on: ubuntu-24.04
    
    steps:
      - name: Validate Inputs
        run: |
          if [ -z "${{ inputs.org_name }}" ]; then
            echo "Error: org_name is required"
            exit 1
          fi
          if [ -z "${{ inputs.workflows }}" ]; then
            echo "Error: workflows is required"
            exit 1
          fi
          if [ -z "${{ inputs.repos }}" ]; then
            echo "Error: repos is required"
            exit 1
          fi
          echo "✓ All inputs validated"

      - name: Disable Multiple Workflows
        env:
          PAT_TOKEN: ${{ secrets.TK_MAJESCO_CALSSIC_PAT }}
          ORG_NAME: ${{ inputs.org_name }}
          WORKFLOWS: ${{ inputs.workflows }}
          REPOS: ${{ inputs.repos }}
        run: |
          # Don't exit on first error - we want to see all results
          set +e
          
          # Verify token is set
          if [ -z "$PAT_TOKEN" ]; then
            echo "❌ ERROR: PAT_TOKEN is not set!"
            echo "   Please configure PROD_FINE_GRAINED_PAT secret in GitHub"
            exit 1
          fi
          
          # Function to disable a workflow in a specific repo
          disable_workflow() {
            local repo=$1
            local workflow=$2
            local api_url="https://api.github.com/repos/$ORG_NAME/$repo/actions/workflows/$workflow/disable"
            
            # Make the API call and capture response + headers
            response=$(curl -s -w "\n%{http_code}" -X PUT \
              -H "Authorization: token $PAT_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "$api_url" 2>&1)
            
            # Extract HTTP code (last line)
            http_code=$(echo "$response" | tail -n1)
            
            # Extract response body (everything except last line)
            response_body=$(echo "$response" | head -n -1)
            
            if [ "$http_code" = "204" ]; then
              return 0
            else
              # Save error details for later inspection
              echo "HTTP_CODE:$http_code" >&2
              echo "RESPONSE:$response_body" >&2
              return 1
            fi
          }
          
          # Function to check if workflow exists and get its status
          check_workflow_status() {
            local repo=$1
            local workflow=$2
            local api_url="https://api.github.com/repos/$ORG_NAME/$repo/actions/workflows/$workflow"
            
            response=$(curl -s -X GET \
              -H "Authorization: token $PAT_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "$api_url" 2>&1)
            
            # Check if workflow is disabled (state: disabled)
            if echo "$response" | grep -q '"state":"disabled"'; then
              echo "DISABLED"
            else
              echo "ENABLED"
            fi
          }
          
          # Function to check if workflow exists
          check_workflow_exists() {
            local repo=$1
            local workflow=$2
            local api_url="https://api.github.com/repos/$ORG_NAME/$repo/actions/workflows/$workflow"
            
            response=$(curl -s -w "\n%{http_code}" -X GET \
              -H "Authorization: token $PAT_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "$api_url" 2>&1)
            
            http_code=$(echo "$response" | tail -n1)
            echo "$http_code"
          }
          
          # Parse inputs: comma-separated and trim whitespace
          mapfile -t workflow_array < <(echo "$WORKFLOWS" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -v '^$')
          mapfile -t repo_array < <(echo "$REPOS" | tr ',' '\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | grep -v '^$')
          
          workflow_count=${#workflow_array[@]}
          repo_count=${#repo_array[@]}
          
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Disable Multiple Workflows"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Organization: $ORG_NAME"
          echo "Repositories: $repo_count"
          echo "Workflows: $workflow_count"
          echo ""
          
          echo "Workflows to disable:"
          for wf in "${workflow_array[@]}"; do
            echo "  • $wf"
          done
          echo ""
          
          echo "Target repositories:"
          for repo in "${repo_array[@]}"; do
            echo "  • $repo"
          done
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          
          # Tracking variables
          total_attempts=0
          total_success=0
          total_failed=0
          total_notfound=0
          
          # Process each repository
          for repo in "${repo_array[@]}"; do
            if [ -z "$repo" ]; then
              continue
            fi
            
            echo ""
            echo "📦 Repository: $repo"
            
            repo_success=0
            repo_failed=0
            repo_disabled_list=""
            repo_failed_list=""
            repo_notfound_list=""
            repo_errors=""
            
            # Check if repo exists first
            echo "   └─ Checking repository access..."
            repo_check=$(curl -s -w "\n%{http_code}" -X GET \
              -H "Authorization: token $PAT_TOKEN" \
              -H "Accept: application/vnd.github.v3+json" \
              "https://api.github.com/repos/$ORG_NAME/$repo")
            
            repo_http=$(echo "$repo_check" | tail -n1)
            
            if [ "$repo_http" = "404" ]; then
              echo "   ✗ Repository not found! Check organization name and repo name."
              echo "   └─ Skipping all workflows for this repo"
              continue
            elif [ "$repo_http" = "403" ]; then
              echo "   ✗ Access forbidden! Check PAT token permissions."
              echo "   └─ Skipping all workflows for this repo"
              continue
            elif [ ! "$repo_http" = "200" ]; then
              echo "   ⚠ Unexpected response (HTTP $repo_http). Continuing anyway..."
            else
              echo "   ✓ Repository accessible"
            fi
            
            # Process each workflow in this repo
            for workflow in "${workflow_array[@]}"; do
              if [ -z "$workflow" ]; then
                continue
              fi
              
              ((total_attempts++))
              
              echo -n "   ├─ Disabling $workflow... "
              
              # Call disable function and capture exit code
              if disable_workflow "$repo" "$workflow" 2>/tmp/disable_error_$$.txt; then
                echo "✓ SUCCESS"
                ((repo_success++))
                ((total_success++))
                repo_disabled_list="$repo_disabled_list $workflow"
              else
                # Check if error file exists and has content
                error_output=$(cat /tmp/disable_error_$$.txt 2>/dev/null || echo "")
                
                # Extract HTTP code from error output
                http_check=$(echo "$error_output" | grep "HTTP_CODE" | cut -d: -f2)
                response_body=$(echo "$error_output" | grep "RESPONSE" | cut -d: -f2-)
                
                if [ -z "$http_check" ]; then
                  # If we couldn't extract code, try checking if workflow exists
                  http_check=$(check_workflow_exists "$repo" "$workflow")
                fi
                
                if [ "$http_check" = "404" ]; then
                  echo "⊘ NOT FOUND"
                  ((total_notfound++))
                  repo_notfound_list="$repo_notfound_list $workflow"
                elif [ "$http_check" = "403" ]; then
                  # 403 on disable usually means workflow is already disabled
                  # Check the actual status
                  workflow_status=$(check_workflow_status "$repo" "$workflow")
                  if [ "$workflow_status" = "DISABLED" ]; then
                    echo "✓ ALREADY DISABLED"
                    ((repo_success++))
                    ((total_success++))
                    repo_disabled_list="$repo_disabled_list $workflow(already)"
                  else
                    echo "✗ PERMISSION DENIED"
                    ((repo_failed++))
                    ((total_failed++))
                    repo_failed_list="$repo_failed_list $workflow(forbidden)"
                  fi
                elif [ "$http_check" = "401" ]; then
                  echo "✗ UNAUTHORIZED (Invalid PAT)"
                  ((repo_failed++))
                  ((total_failed++))
                  repo_failed_list="$repo_failed_list $workflow(auth-error)"
                elif [ "$http_check" = "422" ]; then
                  echo "✗ UNPROCESSABLE (Workflow already disabled?)"
                  ((repo_failed++))
                  ((total_failed++))
                  repo_failed_list="$repo_failed_list $workflow(unprocessable)"
                else
                  echo "✗ FAILED (HTTP $http_check)"
                  ((repo_failed++))
                  ((total_failed++))
                  repo_failed_list="$repo_failed_list $workflow"
                fi
              fi
              
              rm -f /tmp/disable_error_$$.txt
            done
            
            # Summary for this repo
            repo_summary=""
            if [ $repo_success -gt 0 ]; then
              repo_summary="${repo_summary}✓ Disabled:${repo_disabled_list} | "
            fi
            if [ $repo_failed -gt 0 ]; then
              repo_summary="${repo_summary}✗ Failed:${repo_failed_list} | "
            fi
            if [ -n "$repo_notfound_list" ]; then
              repo_summary="${repo_summary}⊘ Not found:${repo_notfound_list}"
            fi
            
            if [ -n "$repo_summary" ]; then
              echo "   └─ $repo_summary"
            fi
            
            if [ $repo_success -eq 0 ] && [ $repo_failed -eq 0 ] && [ -z "$repo_notfound_list" ]; then
              echo "   └─ ⊘ No workflows found in this repository"
            fi
          done
          
          # Final Summary
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Operation Complete!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "Total operations attempted: $total_attempts"
          echo "✓ Successful (disabled or already disabled): $total_success"
          echo "✗ Failed (actual failures): $total_failed"
          echo "⊘ Not found (workflows don't exist): $total_notfound"
          echo ""
          
          # Calculate success rate
          if [ $total_attempts -gt 0 ]; then
            success_rate=$(( (total_success * 100) / total_attempts ))
            echo "Success Rate: $success_rate% ($total_success/$total_attempts)"
            echo ""
          fi
          
          # Diagnostic info
          if [ $total_failed -gt 0 ]; then
            echo "⚠️  ACTUAL FAILURES DETECTED - Diagnostics:"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "These are workflows that could not be disabled due to actual errors."
            echo ""
            echo "Common causes:"
            echo "  • Permission issue on specific workflows (not all workflows)"
            echo "  • Invalid PAT token (check PROD_FINE_GRAINED_PAT secret)"
            echo "  • PAT lacks sufficient permissions"
            echo "  • API rate limit exceeded (5,000 requests/hour)"
            echo ""
            echo "To debug:"
            echo "  1. Verify PAT token is valid and has 'actions:write' scope"
            echo "  2. Check organization name: $ORG_NAME"
            echo "  3. Check repository names exist"
            echo "  4. Check GitHub status page for API issues"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo ""
          fi
          
          if [ $total_success -gt 0 ] || [ $total_notfound -gt 0 ]; then
            echo "✅ Goal achieved!"
            echo "   • Workflows disabled: $total_success"
            if [ $total_notfound -gt 0 ]; then
              echo "   • Workflows not found (don't exist): $total_notfound"
            fi
            if [ $total_failed -gt 0 ]; then
              echo "   ⚠️  Some workflows had issues: $total_failed (see above)"
            fi
          fi
          
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          
          # Exit code logic: Only fail if there are actual failures that prevent the goal
          # Not finding a workflow or it being already disabled = goal achieved
          if [ $total_failed -gt 0 ]; then
            echo ""
            echo "❌ Exit code: 1 (Failures detected)"
            exit 1
          else
            echo ""
            echo "✅ Exit code: 0 (Success - all workflows are disabled)"
            exit 0
          fi
