name: Generate GitHub Enterprise User Report
 
on:
  workflow_dispatch:  # allows manual run
 
jobs:
  generate-report:
    runs-on: ubuntu-24.04
 
    env:
      CLASSIC_PAT: ${{ secrets.MAJESCO_CLASSIC_PAT }}

     # SES_SENDER_EMAIL: ${{ secrets.SES_SENDER_EMAIL }}
     # SES_RECIPIENT_EMAIL: ${{ secrets.SES_RECIPIENT_EMAIL }}
 
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
 
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
 
      - name: Install dependencies
        run: |
          pip install requests pandas boto3 openpyxl
          
      - name: Configure AWS credentials
        uses: Majesco-V3locity/configure-aws-credentials@v1.0
        with:
          aws-access-key-id: ${{ secrets.CORP_CLD_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.CORP_CLD_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
 
      - name: Run report script
        run: python3 PYTHON_Script/GITHUB_enterprise_users_and_group.py
