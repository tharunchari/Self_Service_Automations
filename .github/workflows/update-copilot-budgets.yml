name: Update GitHub Copilot Budgets

on:
  workflow_dispatch:
    inputs:
      enterprise:
        description: 'Enterprise name (vitech or majesco)'
        required: true
        default: ''
        type: choice
        options:
          - vitech
          - majesco-emu
      dry_run:
        description: 'Dry run (no changes made)'
        required: false
        default: true
        type: boolean

env:
  GITHUB_TOKEN: ${{ inputs.enterprise == 'vitech' && secrets.PROD_FINE_GRAINED_PAT || secrets.MAJESCO_CLASSIC_PAT }}

jobs:
  update-budgets:
    runs-on: ubuntu-24.04
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install required packages
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: Validate inputs
        run: |
          ENTERPRISE="${{ github.event.inputs.enterprise }}"
          CSV_FILE="copilot_budgets/budgets_${ENTERPRISE}.csv"
          
          echo "Enterprise: $ENTERPRISE"
          echo "CSV File: $CSV_FILE"
          
          if [ ! -f "$CSV_FILE" ]; then
            echo "❌ ERROR: CSV file not found: $CSV_FILE"
            exit 1
          fi
          
          echo "✓ CSV file found"
          echo "CSV_FILE=$CSV_FILE" >> $GITHUB_ENV
      
      - name: Display CSV preview
        run: |
          echo "📋 CSV File Preview:"
          echo "===================="
          head -10 "${{ env.CSV_FILE }}"
          echo "===================="
          BUDGET_COUNT=$(tail -n +2 "${{ env.CSV_FILE }}" | wc -l)
          echo "Total budgets in file: $BUDGET_COUNT"
      
      - name: Run budget update script (Dry Run)
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          python PYTHON_Script/update_github_copilot_budgets.py \
            -i "${{ env.CSV_FILE }}" \
            -t ${{ secrets.GITHUB_TOKEN }} \
            -e "${{ github.event.inputs.enterprise }}" \
            --dry-run
      
      - name: Run budget update script (Live)
        if: ${{ github.event.inputs.dry_run == 'false' }}
        run: |
          python PYTHON_Script/update_github_copilot_budgets.py \
            -i "${{ env.CSV_FILE }}" \
            -t ${{ secrets.GITHUB_TOKEN }} \
            -e "${{ github.event.inputs.enterprise }}"
      
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: budget-update-results-${{ github.event.inputs.enterprise }}-${{ github.run_number }}
          path: budget_update_results.csv
          retention-days: 30
      
      - name: Create job summary
        if: always()
        run: |
          echo "## GitHub Copilot Budget Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Enterprise:** ${{ github.event.inputs.enterprise }}" >> $GITHUB_STEP_SUMMARY
          echo "**CSV File:** copilot_budgets/budgets_${{ github.event.inputs.enterprise }}.csv" >> $GITHUB_STEP_SUMMARY
          echo "**Mode:** $([ '${{ github.event.inputs.dry_run }}' = 'true' ] && echo 'Dry Run (No Changes)' || echo 'Live Update')" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -f "budget_update_results.csv" ]; then
            echo "### Results" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -15 budget_update_results.csv >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
