name: "GiTHub_Runners_Status"

on:
 # schedule:
    # This will run the workflow every 2 hours
    #- cron: "0 */2 * * *"
    #- cron: "*/30 * * * *"
   # - cron: "55 1-23/2 * * *"
  workflow_dispatch:

jobs:
  check_instances:
    runs-on: ubuntu-24.04
    
    env:
      CLASSIC_PAT: ${{ secrets.CLASSIC_PAT }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
 
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.x'
 
      - name: Install dependencies
        run: pip install boto3 requests

      - name: Configure AWS credentials
        uses: Majesco-V3locity/configure-aws-credentials@v1.0
        with:
          aws-access-key-id: ${{ secrets.CORP_CLD_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.CORP_CLD_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}
          
      - run: python3 PYTHON_Script/Github-self-hosted-runners.py
