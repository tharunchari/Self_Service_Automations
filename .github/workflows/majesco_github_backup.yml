name: Mirror Majesco GitHub Repositories to AWS CodeCommit

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0/3 * * 1-5'

jobs:
  start-runner:
    uses: Majesco-V3locity/Internal-Tools_sub_workflows/.github/workflows/start_runner.yml@main
    with:
      runner_name: "Majesco_Github_Backup_Runner"
    secrets: inherit

  Majesco_GitHub_Backup:
    needs: start-runner
    name: Run Python Backup Script
    runs-on: Majesco_Github_Backup_Runner
    timeout-minutes: 7200  # 5 days (maximum 5 days for self-hosted runners)

    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      # Paths are relative to the repo root (the default working directory for
      # `run:` steps), so ../PYTHON_Script from the old Ansible/ folder becomes
      # PYTHON_Script/ here. --forks is Ansible-only and is replaced by --workers
      # (parallel repos in flight). dry_run=false is the script's default, so no
      # flag is needed; add --dry-run for a discovery-only pass. Majesco-Products,Majesco-LNAH,Majesco-PNC,Majesco-CoreConnect,Majesco-GCO,Majesco-tools-uwb,Majesco-TechService,Majesco-ClaimVantage,Majesco-LossControl,Majesco-EnterpriseRating,Majesco-Air,Majesco-NYL,Majesco-Exaxe,Majesco-CopilotBusiness,Majesco-CopilotEnterprise,Majesco-UWB
      - name: Run GitHub -> CodeCommit backup (Python)
        run: |
          sudo python3 PYTHON_Script/majesco_github_backup.py \
            --github-username "OAadmin_majesco" \
            --github-password "${{ secrets.MAJESCO_CLASSIC_PAT }}" \
            --codecommit-username "${{ secrets.AWS_CODECOMMIT_USERNAME }}" \
            --codecommit-password "${{ secrets.AWS_CODECOMMIT_PASSWORD }}" \
            --incremental-script "PYTHON_Script/incremental-repo-migration.py" \
            --excluded-orgs "Majesco-UWB,Majesco-V3locity,Majesco-V3locityInfra,Majesco-V3locity-Testing-Dry-Run-1,Majesco-V3locity-Testing-Dry-Run-2" \
            --workers 12

  stop-runner:
    needs: [start-runner, Majesco_GitHub_Backup]
    if: always() && needs.start-runner.result == 'success'  # Ensures this job runs even if execute-job fails
    uses: Majesco-V3locity/Internal-Tools_sub_workflows/.github/workflows/stop_runner.yml@main
    with:
      runner_name: "Majesco_Github_Backup_Runner"
    secrets: inherit
