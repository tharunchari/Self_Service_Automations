name: Start Runner Service
permissions:
  contents: read
  pull-requests: read
  actions: read
  security-events: write

on:
  workflow_dispatch:
    inputs:
      runner_name:
        description: 'Runner name to start'
        required: true
        type: choice
        options:
          - Internal_Tools_Automation_Server
          - Internal_Tools_Automation_Server_2
          - Majesco_Github_Backup_Runner
        default: Internal_Tools_Automation_Server
  workflow_call:
    inputs:
      runner_name:
        description: 'Runner name to start'
        required: true
        type: string

env:
  RUNNER_NAME: ${{ inputs.runner_name }}
  # Instance ID mapping — add future runners here following the same pattern
  INSTANCE_ID: >-
    ${{
      inputs.runner_name == 'Internal_Tools_Automation_Server'   && 'i-020530b54ac86537b'  ||
      inputs.runner_name == 'Internal_Tools_Automation_Server_2' && 'i-0e1dace02531761cb'  ||
      inputs.runner_name == 'Majesco_Github_Backup_Runner'       && 'i-049ee416e9ff79232'  ||
      'unknown'
    }}

jobs:
  start-runner:
    name: Check Runner Status
    runs-on: ubuntu-24.04
    steps:
      - name: Validate Runner Name
        run: |
          if [ "${{ env.INSTANCE_ID }}" == "unknown" ]; then
            echo "❌ Runner '${{ env.RUNNER_NAME }}' is not mapped to any EC2 instance."
            echo "Mapped runners:"
            echo "  - Internal_Tools_Automation_Server   → i-020530b54ac86537b"
            echo "  - Internal_Tools_Automation_Server_2 → i-0e1dace02531761cb"
            echo "  - Majesco_Github_Backup_Runner       → i-049ee416e9ff79232"
            exit 1
          fi
          echo "✅ Runner '${{ env.RUNNER_NAME }}' mapped to instance '${{ env.INSTANCE_ID }}'"

      - name: Check Self-Hosted Runner Status
        id: check-status
        run: |
          # Get all runners with pagination support
          page=1
          per_page=100
          RUNNER_DATA=""

          while true; do
            response=$(curl -s -H "Authorization: Bearer ${{ secrets.PROD_FINE_GRAINED_PAT }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/orgs/Majesco-V3locity/actions/runners?per_page=${per_page}&page=${page}")

            # Check if we got any runners in this page
            current_page_runners=$(echo "$response" | jq -r '.runners // []')

            # Look for our specific runner in this page
            RUNNER_DATA=$(echo "$response" | jq -r '.runners[] | select(.name == "'${{ env.RUNNER_NAME }}'")')

            # If we found our runner, break
            if [ -n "$RUNNER_DATA" ] && [ "$RUNNER_DATA" != "null" ]; then
              break
            fi

            # If current page has fewer runners than per_page, we've reached the end
            current_runners_count=$(echo "$current_page_runners" | jq length)
            if [ "$current_runners_count" -lt "$per_page" ]; then
              break
            fi

            page=$((page + 1))
          done

          echo "Runner Data: $RUNNER_DATA"

          RUNNER_STATUS=$(echo "$RUNNER_DATA" | jq -r '.status // "not_found"')
          RUNNER_BUSY=$(echo "$RUNNER_DATA" | jq -r '.busy // "false"')

          echo "Runner Status: $RUNNER_STATUS"
          echo "Runner Busy: $RUNNER_BUSY"

          echo "runner_status=$RUNNER_STATUS" >> $GITHUB_ENV
          echo "runner_busy=$RUNNER_BUSY" >> $GITHUB_ENV

      - name: Checking the Runner Status
        if: env.runner_status == 'online' && env.runner_busy == 'false'
        run: echo "✅ Runner '${{ env.RUNNER_NAME }}' is online and idle."

      - name: Handle runner not found
        if: env.runner_status == 'not_found'
        run: |
          echo "❌ Runner '${{ env.RUNNER_NAME }}' not found in the organization."
          echo "Available runners: Internal_Tools_Automation_Server, Internal_Tools_Automation_Server_2"
          exit 1

      - name: Set up AWS CLI
        if: env.runner_status == 'online' && env.runner_busy == 'true'
        uses: Majesco-V3locity/configure-aws-credentials@v1.0
        with:
          aws-access-key-id: ${{ secrets.CORP_CLD_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.CORP_CLD_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Send email and fail workflow if runner is busy
        if: env.runner_status == 'online' && env.runner_busy == 'true'
        run: |
          echo "Runner is busy. Sending notification and failing job..."
          aws sns publish \
            --topic-arn arn:aws:sns:us-east-1:389180911583:VitechToolsNVAProd \
            --message "The GitHub self-hosted runner ${{ env.RUNNER_NAME }} is currently busy. Please retry in 10 minutes." \
            --subject "GitHub Self-Hosted Runner is Busy"
          exit 1  # ❌ Fails the job here intentionally

      - name: Set up AWS CLI
        if: env.runner_status == 'offline'
        uses: Majesco-V3locity/configure-aws-credentials@v1.0
        with:
          aws-access-key-id: ${{ secrets.CORP_CLD_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.CORP_CLD_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Start EC2 Instance
        if: env.runner_status == 'offline'
        run: |
          aws ec2 start-instances --instance-ids ${{ env.INSTANCE_ID }} --region ${{ vars.AWS_REGION }}
          aws ec2 wait instance-running --instance-ids ${{ env.INSTANCE_ID }} --region ${{ vars.AWS_REGION }}
          echo "✅ EC2 instance ${{ env.INSTANCE_ID }} started."

      - name: Wait for runner service to initialize
        if: env.runner_status == 'offline'
        run: sleep 10

      - name: Run Command on EC2 Instance to start the runner service
        if: env.runner_status == 'offline'
        run: |
          aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets Key=instanceids,Values=${{ env.INSTANCE_ID }} \
            --parameters "commands=['cd /actions-runner && sudo ./svc.sh start']" \
            --region ${{ vars.AWS_REGION }}
        shell: bash
